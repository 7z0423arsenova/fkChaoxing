; 配置模板。复制为 config.ini 后填写；桌面版也可以在窗口的配置向导中填写。
; 复制为 config.ini 后填入自己的账号和密码；不要把真实配置提交到仓库。
; 文件使用 UTF-8；节名和键名区分大小写；% 无需转义。

; use_cookies 建议关着，这样被标记了，重试一般就会恢复了
[common]
use_cookies = false
username =
password =
; 课程 ID，多个用英文逗号分隔；桌面窗口也可直接勾选课程。
course_list =
; 视频倍速 1～2；同时处理的章节数为 4 ~ 8, 默认为4 。
; 当然你可以开得很高(坏笑)， 比如 开 256 jobs. 后果未知
speed = 1
jobs = 4
; 是否启用章节检测答题；false 时跳过答题，继续视频等任务。
work_enabled = true
; 先尝试把媒体进度直接上报到结尾；服务器确认后立即完成，失败则回退正常播放。
instant_complete = true
; 视频等任务运行时，提前在后台查询后续章节检测答案（默认 false）。
; 可缩短章节检测等待时间，但会提前消耗题库/AI 请求次数。
work_prefetch_enabled = false

[tiku]
; 留空表示不启用。桌面向导支持 TikuYanxi、TikuGo、AI。
; TikuGo（GO题）是公开题库，不需要 Token，适合直接作为免费题库。
provider =
; 默认只保存找到的答案，不自动提交章节检测。
submit = false
; 自动提交的最低题库覆盖率（0～1，默认 0.8）。
; 覆盖率低于该值时只保存答案，不提交；命令行可用 --cover-rate 覆盖。
cover_rate = 0.8
; 多个题目间的等待秒数。
; delay = 1.0
; 公开题库示例：provider = TikuGo
; GO题可选填 go_authorization（授权码），公共接口留空即可。
; GO题请求间隔（秒，默认 1.0）、失败重试次数（默认 3）、退避基数（默认 1.2 秒）：
; go_min_interval = 1.0
; go_retry_times = 3
; go_retry_backoff = 1.2
; 开源自建题库：provider = TikuAdapter，并填写服务地址 url。
; url =
; TikuYanxi 需要填 tokens。
; AI 可以用外部 OpenAI 兼容接口，也可以用本机 Ollama。
; 外部接口示例：endpoint = https://example.com/v1，并填写 key、model。
; 本机 Ollama：llm_preset = ollama，model = qwen3:4b-instruct，key 留空。
; 多个题库按顺序回退，例如 provider = TikuGo,AI。
; tokens =
; go_authorization =
; llm_preset =
; endpoint =
; key =
; model =

[captcha]
; 学习通反爬图片验证码自动识别（ddddocr）。
; 需要本机安装 Python 与 ddddocr：python -m pip install ddddocr
; 默认关闭；开启后遇到验证码会自动识别并重发被拦截的请求。
enabled = false
; Python 解释器；留空时依次尝试 python3、python。
; python = python3
; 单次验证最多识别几次（1～20，默认 6）。
; max_retries = 6
; 每次识别前的等待秒数（默认 5），太快可能再次触发风控。
; delay = 5
; ddddocr 启动和单次识别的超时秒数（默认 30）。
; timeout = 30
; 验证码服务地址，通常不需要修改。
; endpoint = https://mooc1-api.chaoxing.com
